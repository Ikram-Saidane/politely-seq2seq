[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "politely"
version = "2.0.0"
description = "Impolite-to-polite sentence rewriting with an LSTM encoder-decoder built from scratch (NLP course project)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
